PACKAGE_NAME="ethercat"
PACKAGE_VERSION="#MODULE_VERSION#"

# Build the master first (external modules in master/ depend on it),
# then the generic network driver shipped with the tree.
MAKE[0]="./bootstrap && ./configure \
    --with-linux-dir=/lib/modules/${kernelver}/build \
    --disable-8139too \
    --disable-update-modules \
    --disable-update-rules && \
    make -C master KERNELDIR=/lib/modules/${kernelver}/build modules && \
    make -C devices KERNELDIR=/lib/modules/${kernelver}/build modules"

CLEAN="make distclean || true; find . -name '*.ko' -delete; find . -name '*.o' -delete"

BUILT_MODULE_NAME[0]="ec_master"
BUILT_MODULE_LOCATION[0]="master"
DEST_MODULE_LOCATION[0]="/extra"

BUILT_MODULE_NAME[1]="ec_generic"
BUILT_MODULE_LOCATION[1]="devices"
DEST_MODULE_LOCATION[1]="/extra"

AUTOINSTALL="yes"
