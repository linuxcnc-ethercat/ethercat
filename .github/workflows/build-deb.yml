name: Build .deb packages

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.distro }} (${{ matrix.arch }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-11, debian-12, debian-13, ubuntu-22.04, ubuntu-24.04]
        arch: [amd64, arm64]
        variant: [main, eoe]
        # Distro containers are multi-arch; native arm64 runners select the
        # matching image variant automatically.
        include:
          - distro: debian-11
            image: debian:bullseye
            deb_rev: deb11u1
          - distro: debian-12
            image: debian:bookworm
            deb_rev: deb12u1
          - distro: debian-13
            image: debian:trixie
            deb_rev: deb13u1
          - distro: ubuntu-22.04
            image: ubuntu:22.04
            deb_rev: ubuntu22.04u1
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            deb_rev: ubuntu24.04u1

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          DISTRO: ${{ matrix.distro }}
        run: |
          echo 'Acquire::Retries "10";' > /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::http::Timeout "30";' >> /etc/apt/apt.conf.d/80-retries
          if [ "$DISTRO" = debian-11 ]; then
              # Bullseye is EOL: use the main archive and the last security
              # snapshot rather than the removed deb.debian.org entries.
              sed -i -e 's|http://deb.debian.org/debian-security|http://snapshot.debian.org/archive/debian-security/20260831T000000Z|' \
                     -e 's|http://deb.debian.org/debian|http://archive.debian.org/debian|' \
                     /etc/apt/sources.list
              echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/90-archive
          fi
          install_pkgs() {
              apt-get update && \
              apt-get install -y --no-install-recommends \
                  build-essential \
                  debhelper \
                  devscripts \
                  dpkg-dev \
                  autoconf \
                  automake \
                  libtool \
                  pkg-config \
                  dkms \
                  git \
                  ca-certificates \
                  fakeroot
          }
          for i in 1 2 3 4 5; do
              install_pkgs && break || { echo "apt attempt $i failed; sleeping"; sleep 30; }
          done
          command -v git
          command -v dpkg-buildpackage
          command -v dch

      - name: Checkout
        uses: actions/checkout@v5

      - name: Mark repo as safe (container runs as root)
        run: git config --global --add safe.directory "$PWD"

      - name: Stamp version with codename suffix
        run: |
          # Give each distro a unique package version for apt ingestion.
          base_ver=$(dpkg-parsechangelog --show-field Version)
          new_ver="${base_ver}+${{ matrix.deb_rev }}"
          msg="CI build for ${{ matrix.distro }}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              msg="Release ${GITHUB_REF_NAME} for ${{ matrix.distro }}"
          fi
          DEBEMAIL="ci@linuxcnc-ethercat.github.io" DEBFULLNAME="LinuxCNC-EtherCAT CI" \
              dch --newversion "${new_ver}" --distribution stable "$msg"

      - name: Prepare EoE variant
        if: matrix.variant == 'eoe'
        run: |
          for i in 1 2 3; do
            apt-get install -y --no-install-recommends python3 && break || sleep 15
          done
          ./script/prepare-eoe.sh

      - name: Build packages
        run: |
          ./script/build-deb.sh -j$(nproc)

      - name: Check package dependencies and DKMS payload
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          suffix=""
          if [ "$VARIANT" = eoe ]; then suffix="-eoe"; fi
          master_pkg=(../ethercat-master${suffix}_*_*.deb)
          dkms_pkg=(../ethercat-dkms${suffix}_*_all.deb)
          version=$(dpkg-deb -f "${master_pkg[0]}" Version)
          master_depends=$(dpkg-deb -f "${master_pkg[0]}" Depends)
          grep -F "ethercat-dkms${suffix} (= ${version})" <<<"$master_depends"
          grep -F "libethercat${suffix} (= ${version})" <<<"$master_depends"
          dkms_depends=$(dpkg-deb -f "${dkms_pkg[0]}" Depends)
          for tool in autoconf automake libtool pkg-config; do
              grep -w "$tool" <<<"$dkms_depends"
          done
          dpkg-deb --contents "${dkms_pkg[0]}" | \
              grep -E "usr/src/ethercat${suffix}-[^/]+/dkms.conf$"
          dpkg-deb --contents "${dkms_pkg[0]}" | \
              grep -E "usr/src/ethercat${suffix}-[^/]+/master/module.c$"

      - name: Collect artefacts
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for src in ../ethercat-master*_*.deb \
                     ../ethercat-dkms*_all.deb \
                     ../libethercat*_*.deb; do
              [ -f "$src" ] || continue
              case "$src" in *-dbgsym*) continue ;; esac
              # DKMS is arch:all. Ship it only from amd64 so the release
              # never receives duplicate assets from the arm64 job.
              if [ "$ARCH" != "amd64" ]; then
                  case "$src" in *ethercat-dkms*) continue ;; esac
              fi
              cp "$src" "artifacts/$(basename "$src")"
          done

      - name: Upload artefacts
        uses: actions/upload-artifact@v7
        with:
          name: ethercat-deb-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.variant }}
          path: artifacts/*.deb
          if-no-files-found: error

  kernel-6-18-clang:
    name: Linux 6.18 (Clang)
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/etherlab.org/build-container-factory/ethercat-kernels:k6.18-rt
    env:
      # The prepared kernel tree has no complete Module.symvers.
      KBUILD_MODPOST_WARN: "1"
    steps:
      - name: Install Clang
        run: |
          if command -v zypper >/dev/null; then
              zypper --non-interactive install -y clang llvm lld
              zypper clean -a
          elif command -v apk >/dev/null; then
              apk add --no-cache clang llvm lld
          elif command -v apt-get >/dev/null; then
              apt-get update
              apt-get install -y --no-install-recommends clang
          elif command -v dnf >/dev/null; then
              dnf install -y clang
          else
              echo "No supported package manager found" >&2
              exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Mark repo as safe (container runs as root)
        run: git config --global --add safe.directory "$PWD"

      - name: Prepare kernel with Clang
        run: |
          make -C "$KERNEL_SRC" LLVM=1 x86_64_defconfig
          "$KERNEL_SRC/scripts/config" --file "$KERNEL_SRC/.config" \
              --enable CONFIG_EXPERT --enable CONFIG_PREEMPT_RT
          make -C "$KERNEL_SRC" LLVM=1 olddefconfig modules_prepare

      - name: Bootstrap
        run: ./bootstrap

      - name: Configure
        run: |
          ./configure \
            --with-linux-dir=/usr/src/linux-6.18.45-rt \
            --enable-8139too \
            --enable-ccat \
            --enable-dwmac-intel \
            --enable-e100 \
            --enable-e1000 \
            --enable-e1000e \
            --enable-genet \
            --enable-igb \
            --enable-igc \
            --enable-macb \
            --enable-r8169 \
            --enable-stmmac-pci

      - name: Build with Clang
        run: make -j$(nproc) all modules LLVM=1 CXX=clang++

  dkms-llvm:
    name: DKMS (LLVM auto-detection)
    runs-on: ubuntu-latest
    # Experimental coverage for LLVM-built kernels; do not block releases.
    continue-on-error: true
    container:
      image: registry.gitlab.com/etherlab.org/build-container-factory/ethercat-kernels:k6.18-rt
    env:
      # The prepared kernel tree has no complete Module.symvers.
      KBUILD_MODPOST_WARN: "1"
    steps:
      - name: Install DKMS and Clang
        run: |
          zypper --non-interactive install -y dkms clang llvm lld
          zypper clean -a

      - name: Checkout
        uses: actions/checkout@v5

      - name: Mark repo as safe (container runs as root)
        run: git config --global --add safe.directory "$PWD"

      - name: Prepare kernel with Clang
        run: |
          make -C "$KERNEL_SRC" LLVM=1 x86_64_defconfig
          "$KERNEL_SRC/scripts/config" --file "$KERNEL_SRC/.config" \
              --enable CONFIG_EXPERT --enable CONFIG_PREEMPT_RT
          make -C "$KERNEL_SRC" LLVM=1 olddefconfig modules_prepare

      - name: Build modules with DKMS
        shell: bash
        run: |
          set -euo pipefail
          kernelver=$(make -s -C "$KERNEL_SRC" kernelrelease)
          mkdir -p "/lib/modules/$kernelver"
          ln -s "$KERNEL_SRC" "/lib/modules/$kernelver/build"
          mkdir /usr/src/ethercat-ci
          cp -a . /usr/src/ethercat-ci
          sed 's/#MODULE_VERSION#/ci/' debian/dkms.conf \
              > /usr/src/ethercat-ci/dkms.conf
          dkms add -m ethercat -v ci
          # DKMS detects the Clang-built kernel and appends LLVM=1 itself.
          dkms build -m ethercat -v ci -k "$kernelver"
          module=$(find "/var/lib/dkms/ethercat/ci/$kernelver" \
              -path '*/module/ec_master.ko' -print -quit)
          [ -n "$module" ]
          readelf -p .comment "$module" | grep -i clang
          dkms status -m ethercat -v ci -k "$kernelver"

  release:
    name: Attach debs to GitHub release
    needs: [build, kernel-6-18-clang]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artefacts
        run: find artifacts -type f -name '*.deb' -print

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.deb
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

      - name: Trigger apt-repo ingestion
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
              echo "APT_DISPATCH_TOKEN not set; skipping ingestion dispatch."
              exit 0
          fi
          gh api \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              /repos/linuxcnc-ethercat/apt/dispatches \
              -f event_type=ingest-release \
              -f "client_payload[source_repo]=${{ github.repository }}" \
              -f "client_payload[tag]=${{ github.ref_name }}"
