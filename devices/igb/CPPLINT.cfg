# The igb driver is a lightly patched copy of the in-kernel igb driver
# (see update.sh), kept close to upstream formatting so future updates
# can be diffed/merged against new kernel sources with minimal noise.
# The checks below mostly fire on plain kernel coding-style idioms
# (long lines, blank lines at block boundaries, C-style casts, empty
# ";"-only statements, multi-line string literals) that have nothing to
# do with the EtherCAT integration bits; reformatting the copied parts
# to satisfy them would defeat the purpose of keeping the diff small.
# This filter is added on top of (not instead of) devices/CPPLINT.cfg
# and the top-level CPPLINT.cfg.
filter=-build/include
filter=-readability/multiline_string
filter=-runtime/casting
filter=-whitespace/blank_line
filter=-whitespace/line_length
filter=-whitespace/semicolon
