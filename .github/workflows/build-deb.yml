name: Build .deb packages

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-11, debian-12, debian-13, ubuntu-22.04, ubuntu-24.04]
        include:
          - distro: debian-11
            image: debian:bullseye
            deb_rev: deb11u1
          - distro: debian-12
            image: debian:bookworm
            deb_rev: deb12u1
          - distro: debian-13
            image: debian:trixie
            deb_rev: deb13u1
          - distro: ubuntu-22.04
            image: ubuntu:22.04
            deb_rev: ubuntu22.04u1
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            deb_rev: ubuntu24.04u1

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'Acquire::Retries "10";' > /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::http::Timeout "30";' >> /etc/apt/apt.conf.d/80-retries
          install_pkgs() {
              apt-get update && \
              apt-get install -y --no-install-recommends \
                  build-essential \
                  debhelper \
                  devscripts \
                  dpkg-dev \
                  autoconf \
                  automake \
                  libtool \
                  pkg-config \
                  dkms \
                  git \
                  ca-certificates \
                  fakeroot
          }
          for i in 1 2 3 4 5; do
              install_pkgs && break || { echo "apt attempt $i failed; sleeping"; sleep 30; }
          done
          command -v git
          command -v dpkg-buildpackage
          command -v dch

      - name: Checkout
        uses: actions/checkout@v5

      - name: Mark repo as safe (container runs as root)
        run: git config --global --add safe.directory "$PWD"

      - name: Stamp version with codename suffix
        run: |
          # Pull the current version straight from changelog and append a
          # codename revision so each distro's .deb is uniquely named in the
          # downstream apt repo pool. Tag pushes embed the tag in the entry.
          base_ver=$(dpkg-parsechangelog --show-field Version)
          new_ver="${base_ver}+${{ matrix.deb_rev }}"
          msg="CI build for ${{ matrix.distro }}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              msg="Release ${GITHUB_REF_NAME} for ${{ matrix.distro }}"
          fi
          DEBEMAIL="ci@linuxcnc-ethercat.github.io" DEBFULLNAME="LinuxCNC-EtherCAT CI" \
              dch --newversion "${new_ver}" --distribution stable "$msg"

      - name: Build packages
        run: |
          ./script/build-deb.sh -j$(nproc)

      - name: Collect artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for src in ../ethercat-master*_*.deb \
                     ../ethercat-dkms*_all.deb \
                     ../libethercat*_*.deb; do
              [ -f "$src" ] || continue
              case "$src" in *-dbgsym*) continue ;; esac
              cp "$src" "artifacts/$(basename "$src")"
          done

      - name: Upload artefacts
        uses: actions/upload-artifact@v7
        with:
          name: ethercat-deb-${{ matrix.distro }}
          path: artifacts/*.deb
          if-no-files-found: error

  release:
    name: Attach debs to GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artefacts
        run: find artifacts -type f -name '*.deb' -print

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.deb
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

      - name: Trigger apt-repo ingestion
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
              echo "APT_DISPATCH_TOKEN not set; skipping ingestion dispatch."
              exit 0
          fi
          gh api \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              /repos/linuxcnc-ethercat/apt/dispatches \
              -f event_type=ingest-release \
              -f "client_payload[source_repo]=${{ github.repository }}" \
              -f "client_payload[tag]=${{ github.ref_name }}"
