# The e1000 driver is a lightly patched copy of the in-kernel e1000
# driver (see update.sh), kept close to upstream formatting so future
# updates can be diffed/merged against new kernel sources with minimal
# noise. The checks below mostly fire on plain kernel coding-style
# idioms (long lines, blank lines at block boundaries, spacing around
# operators/commas, C-style casts, empty ";"-only statements, trailing
# whitespace) that have nothing to do with the EtherCAT integration
# bits; reformatting the copied parts to satisfy them would defeat the
# purpose of keeping the diff small. This filter is added on top of
# (not instead of) devices/CPPLINT.cfg and the top-level CPPLINT.cfg.
filter=-build/include
filter=-runtime/casting
filter=-whitespace/blank_line
filter=-whitespace/comma
filter=-whitespace/end_of_line
filter=-whitespace/line_length
filter=-whitespace/operators
filter=-whitespace/semicolon
