name: Build .deb packages

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.distro }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04]
        variant: [main, eoe]
        include:
          - distro: debian-12
            image: debian:bookworm
            deb_rev: deb12u1
          - distro: debian-13
            image: debian:trixie
            deb_rev: deb13u1
          - distro: ubuntu-22.04
            image: ubuntu:22.04
            deb_rev: ubuntu22.04u1
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            deb_rev: ubuntu24.04u1

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Make apt resilient against archive.ubuntu.com hiccups that
          # have intermittently stalled the ubuntu-24.04 jobs.
          echo 'Acquire::Retries "10";' > /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::http::Timeout "30";' >> /etc/apt/apt.conf.d/80-retries
          install_pkgs() {
              apt-get update && \
              apt-get install -y --no-install-recommends \
                  build-essential \
                  debhelper \
                  devscripts \
                  dpkg-dev \
                  autoconf \
                  automake \
                  libtool \
                  pkg-config \
                  dkms \
                  git \
                  ca-certificates \
                  fakeroot
          }
          for i in 1 2 3 4 5; do
              install_pkgs && break || { echo "apt attempt $i failed; sleeping"; sleep 30; }
          done
          # Sanity-check the packages we actually need at later steps.
          command -v git
          command -v dpkg-buildpackage

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark repo as safe (container runs as root)
        run: git config --global --add safe.directory "$PWD"

      - name: Stamp version with codename suffix
        run: |
          # Give each distro a unique package version for apt ingestion.
          base_ver=$(dpkg-parsechangelog --show-field Version)
          new_ver="${base_ver}+${{ matrix.deb_rev }}"
          msg="CI build for ${{ matrix.distro }}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              msg="Release ${GITHUB_REF_NAME} for ${{ matrix.distro }}"
          fi
          DEBEMAIL="ci@linuxcnc-ethercat.github.io" DEBFULLNAME="LinuxCNC-EtherCAT CI" \
              dch --newversion "${new_ver}" --distribution stable "$msg"

      - name: Prepare EoE variant
        if: matrix.variant == 'eoe'
        run: |
          for i in 1 2 3; do
            apt-get install -y --no-install-recommends python3 && break || sleep 15
          done
          ./script/prepare-eoe.sh

      - name: Build packages
        run: |
          ./script/build-deb.sh -j$(nproc)

      - name: Collect artefacts
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/${{ matrix.distro }}-${{ matrix.variant }}"
          mkdir -p "$out"
          # Tag each .deb with distro+variant so release upload sees
          # unique names across the matrix (softprops races on dupes).
          # The wildcard suffixes catch both base and -eoe package names.
          for src in ../ethercat-master*_*.deb \
                     ../ethercat-dkms*_all.deb \
                     ../libethercat*_*.deb; do
              [ -f "$src" ] || continue
              fname="$(basename "$src")"
              base="${fname%_*.deb}"
              suffix="${fname##*_}"
              cp "$src" "$out/${base}_${{ matrix.distro }}_${suffix}"
          done

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ethercat-deb-${{ matrix.distro }}-${{ matrix.variant }}
          path: artifacts/${{ matrix.distro }}-${{ matrix.variant }}/*.deb
          if-no-files-found: error

  kernel-6-18-clang:
    name: Linux 6.18 (Clang)
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/etherlab.org/build-container-factory/ethercat-kernels:k6.18-rt
    env:
      # The prepared kernel tree has no complete Module.symvers.
      KBUILD_MODPOST_WARN: "1"
    steps:
      - name: Install Clang
        run: |
          if command -v zypper >/dev/null; then
              zypper --non-interactive install -y clang llvm lld
              zypper clean -a
          elif command -v apk >/dev/null; then
              apk add --no-cache clang llvm lld
          elif command -v apt-get >/dev/null; then
              apt-get update
              apt-get install -y --no-install-recommends clang
          elif command -v dnf >/dev/null; then
              dnf install -y clang
          else
              echo "No supported package manager found" >&2
              exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark repo as safe (container runs as root)
        run: git config --global --add safe.directory "$PWD"

      - name: Prepare kernel with Clang
        run: |
          make -C "$KERNEL_SRC" LLVM=1 x86_64_defconfig
          "$KERNEL_SRC/scripts/config" --file "$KERNEL_SRC/.config" \
              --enable CONFIG_EXPERT --enable CONFIG_PREEMPT_RT
          make -C "$KERNEL_SRC" LLVM=1 olddefconfig modules_prepare

      - name: Bootstrap
        run: ./bootstrap

      - name: Configure
        run: |
          ./configure \
            --with-linux-dir=/usr/src/linux-6.18.45-rt \
            --enable-8139too \
            --enable-ccat \
            --enable-dwmac-intel \
            --enable-e100 \
            --enable-e1000 \
            --enable-e1000e \
            --enable-genet \
            --enable-igb \
            --enable-igc \
            --enable-macb \
            --enable-r8169 \
            --enable-stmmac-pci

      - name: Build with Clang
        run: make -j$(nproc) all modules LLVM=1 CXX=clang++

  release:
    name: Attach debs to GitHub release
    needs: [build, kernel-6-18-clang]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artefacts
        run: find artifacts -type f -name '*.deb' -print

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.deb
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

      - name: Trigger apt-repo ingestion
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
              echo "APT_DISPATCH_TOKEN not set; skipping ingestion dispatch."
              exit 0
          fi
          gh api \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              /repos/linuxcnc-ethercat/apt/dispatches \
              -f event_type=ingest-release \
              -f "client_payload[source_repo]=${{ github.repository }}" \
              -f "client_payload[tag]=${{ github.ref_name }}"
