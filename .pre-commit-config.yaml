# nodeenv's 'latest' picks pre-releases (e.g. v27.0.0-alpha) and fails
default_language_version:
    node: lts

repos:

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-added-large-files
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-case-conflict
    -   id: check-merge-conflict
        args: [--assume-in-merge]
    -   id: check-symlinks
    -   id: fix-byte-order-marker
    -   id: mixed-line-ending

-   repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
    -   id: markdownlint

-   repo: https://github.com/tcort/markdown-link-check
    rev: v3.14.2
    hooks:
    -   id: markdown-link-check

-   repo: https://github.com/cpplint/cpplint
    rev: 2.0.2
    hooks:
      - id: cpplint

-   repo: local
    hooks:
    -   id: cli-tool-test
        name: cli-tool-test
        language: system
        pass_filenames: false
        files: ^(tool/.*\.(cpp|h)|include/ecrt\.h|master/(foe|ioctl|globals)\.h)$
        entry: >-
          sh -c 'if test ! -f tool/Makefile; then
          { echo; echo "WARNING: tool/Makefile missing, skipping tests.";
          echo "Run ./bootstrap && ./configure to enable them.";
          printf "%73s" ""; } 2>/dev/null >/dev/tty;
          exit 0; fi;
          log=$(mktemp) && trap "rm -f $log" EXIT &&
          make -s -C tool check >$log 2>&1 || { cat $log; exit 1; }'
