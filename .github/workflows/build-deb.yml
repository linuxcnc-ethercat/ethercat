name: Build .deb packages

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.distro }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04]
        variant: [main, eoe]
        include:
          - distro: debian-12
            image: debian:bookworm
          - distro: debian-13
            image: debian:trixie
          - distro: ubuntu-22.04
            image: ubuntu:22.04
          - distro: ubuntu-24.04
            image: ubuntu:24.04

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dpkg-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            dkms \
            git \
            ca-certificates \
            fakeroot

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark repo as safe (container runs as root)
        run: git config --global --add safe.directory "$PWD"

      - name: Prepare EoE variant
        if: matrix.variant == 'eoe'
        run: |
          apt-get install -y --no-install-recommends python3
          ./script/prepare-eoe.sh

      - name: Build packages
        run: |
          ./script/build-deb.sh -j$(nproc)

      - name: Collect artefacts
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/${{ matrix.distro }}-${{ matrix.variant }}"
          mkdir -p "$out"
          # Tag each .deb with distro+variant so release upload sees
          # unique names across the matrix (softprops races on dupes).
          # The wildcard suffixes catch both base and -eoe package names.
          for src in ../ethercat-master*_*.deb \
                     ../ethercat-dkms*_all.deb \
                     ../libethercat*_*.deb; do
              [ -f "$src" ] || continue
              fname="$(basename "$src")"
              base="${fname%_*.deb}"
              suffix="${fname##*_}"
              cp "$src" "$out/${base}_${{ matrix.distro }}_${suffix}"
          done

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ethercat-deb-${{ matrix.distro }}-${{ matrix.variant }}
          path: artifacts/${{ matrix.distro }}-${{ matrix.variant }}/*.deb
          if-no-files-found: error

  release:
    name: Attach debs to GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artefacts
        run: find artifacts -type f -name '*.deb' -print

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.deb
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
