name: Build .deb packages

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-12
            image: debian:bookworm
          - distro: debian-13
            image: debian:trixie
          - distro: ubuntu-22.04
            image: ubuntu:22.04
          - distro: ubuntu-24.04
            image: ubuntu:24.04

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dpkg-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            dkms \
            git \
            ca-certificates \
            fakeroot

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark repo as safe (container runs as root)
        run: git config --global --add safe.directory "$PWD"

      - name: Build packages
        run: |
          ./script/build-deb.sh -j$(nproc)

      - name: Collect artefacts
        run: |
          mkdir -p artifacts/${{ matrix.distro }}
          for f in ../ethercat-master_*_*.deb \
                   ../ethercat-dkms_*_all.deb \
                   ../libethercat_*_*.deb \
                   ../libethercat-dev_*_*.deb; do
            base=$(basename "$f")
            # Insert ~${distro} before _<arch>.deb so each distro's debs
            # have a unique asset name in the GitHub release.
            new=$(echo "$base" | sed -E "s/_(amd64|all)\.deb$/~${{ matrix.distro }}_\1.deb/")
            cp "$f" "artifacts/${{ matrix.distro }}/$new"
          done

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ethercat-deb-${{ matrix.distro }}
          path: artifacts/${{ matrix.distro }}/*.deb
          if-no-files-found: error

  release:
    name: Attach debs to GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artefacts
        run: find artifacts -type f -name '*.deb' -print

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.deb
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
