# The stmmac driver is a lightly patched copy of the in-kernel stmmac
# driver (see update.sh), kept close to upstream formatting so future
# updates can be diffed/merged against new kernel sources with minimal
# noise. The checks below mostly fire on plain kernel coding-style
# idioms (long lines, blank lines at block boundaries, GCC-style
# variable-length arrays sized by a compile-time constant) or on the
# fact that several of the copied upstream source files carry no
# copyright notice of their own; none of this has anything to do with
# the EtherCAT integration bits, and reformatting the copied parts to
# satisfy them would defeat the purpose of keeping the diff small. This
# filter is added on top of (not instead of) devices/CPPLINT.cfg and
# the top-level CPPLINT.cfg.
filter=-build/include
filter=-legal/copyright
filter=-runtime/arrays
filter=-whitespace/blank_line
filter=-whitespace/line_length
