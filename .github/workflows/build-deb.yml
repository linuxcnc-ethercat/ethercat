name: Build .deb packages

on:
  push:
    branches: [dev-1.7, dev-1.6, stable-1.6]
    tags: ['v*']
  pull_request:
    branches: [dev-1.7, dev-1.6, stable-1.6]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-12
            image: debian:bookworm
          - distro: debian-13
            image: debian:trixie
          - distro: ubuntu-22.04
            image: ubuntu:22.04
          - distro: ubuntu-24.04
            image: ubuntu:24.04

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dpkg-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            dkms \
            git \
            ca-certificates \
            fakeroot

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark repo as safe (container runs as root)
        run: git config --global --add safe.directory "$PWD"

      - name: Build packages
        run: |
          ./script/build-deb.sh -j$(nproc)

      - name: Collect artefacts
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/${{ matrix.distro }}"
          mkdir -p "$out"
          # Tag each .deb with the distro so the release upload step
          # does not see four identically named files (ubuntu-22.04 +
          # ubuntu-24.04 + debian-12 + debian-13 all produce e.g.
          # ethercat_1.6.9_amd64.deb). softprops/action-gh-release
          # races on same-name uploads (HTTP 404 on the delete-then-
          # upload sequence).
          for src in ../ethercat_*_*.deb \
                     ../ethercat-dkms_*_all.deb \
                     ../libethercat_*_*.deb \
                     ../libethercat-dev_*_*.deb; do
              [ -f "$src" ] || continue
              fname="$(basename "$src")"
              # Strip the trailing _<arch>.deb (or _all.deb) and re-append
              # with the distro tag wedged in.
              base="${fname%_*.deb}"
              suffix="${fname##*_}"
              cp "$src" "$out/${base}_${{ matrix.distro }}_${suffix}"
          done

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ethercat-deb-${{ matrix.distro }}
          path: artifacts/${{ matrix.distro }}/*.deb
          if-no-files-found: error

  kernel-6-18-clang:
    name: Linux 6.18 (Clang)
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/etherlab.org/build-container-factory/ethercat-kernels:k6.18-rt
    env:
      # The prepared kernel tree has no complete Module.symvers.
      KBUILD_MODPOST_WARN: "1"
    steps:
      - name: Install Clang
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark repo as safe (container runs as root)
        run: git config --global --add safe.directory "$PWD"

      - name: Bootstrap
        run: ./bootstrap

      - name: Configure
        run: |
          ./configure \
            --with-linux-dir=/usr/src/linux-6.18.45-rt \
            --enable-8139too \
            --enable-ccat \
            --enable-dwmac-intel \
            --enable-e100 \
            --enable-e1000 \
            --enable-e1000e \
            --enable-genet \
            --enable-igb \
            --enable-igc \
            --enable-macb \
            --enable-r8169 \
            --enable-stmmac-pci

      - name: Build with Clang
        run: make -j$(nproc) all modules CC=clang CXX=clang++

  release:
    name: Attach debs to GitHub release
    needs: [build, kernel-6-18-clang]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artefacts
        run: find artifacts -type f -name '*.deb' -print

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.deb
          generate_release_notes: true
