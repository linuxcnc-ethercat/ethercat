PACKAGE_NAME="ethercat"
PACKAGE_VERSION="#MODULE_VERSION#"

# Feature set mirrors the userspace configure in debian/rules so the
# kernel modules and the library agree on which APIs exist.
# Drivers: generic + common Intel/Realtek/Broadcom NICs.
# EoE is disabled here; the EoE variant build flips it via
# script/prepare-eoe.sh before dpkg-buildpackage.
MAKE[0]="./bootstrap && ./configure \
    --with-linux-dir=/lib/modules/${kernelver}/build \
    --enable-generic \
    --enable-8139too \
    --enable-e100 \
    --enable-e1000 \
    --enable-e1000e \
    --enable-r8169 \
    --enable-igb \
    --enable-igc \
    --enable-genet \
    --disable-stmmac-pci \
    --disable-dwmac-intel \
    --disable-ccat \
    --disable-eoe \
    --enable-cycles \
    --enable-hrtimer \
    --disable-rtdm \
    --disable-debug-if \
    --disable-debug-ring \
    --disable-regalias \
    --disable-tty \
    --disable-wildcards \
    --enable-sii-assign \
    --enable-rt-syslog && \
    make modules"

CLEAN="make distclean || true; find . -name '*.ko' -delete; find . -name '*.o' -delete"

BUILT_MODULE_NAME[0]="ec_master"
BUILT_MODULE_LOCATION[0]="master"
DEST_MODULE_LOCATION[0]="/extra"

BUILT_MODULE_NAME[1]="ec_generic"
BUILT_MODULE_LOCATION[1]="devices"
DEST_MODULE_LOCATION[1]="/extra"

BUILT_MODULE_NAME[2]="ec_8139too"
BUILT_MODULE_LOCATION[2]="devices"
DEST_MODULE_LOCATION[2]="/extra"

BUILT_MODULE_NAME[3]="ec_e100"
BUILT_MODULE_LOCATION[3]="devices"
DEST_MODULE_LOCATION[3]="/extra"

BUILT_MODULE_NAME[4]="ec_e1000"
BUILT_MODULE_LOCATION[4]="devices/e1000"
DEST_MODULE_LOCATION[4]="/extra"

BUILT_MODULE_NAME[5]="ec_e1000e"
BUILT_MODULE_LOCATION[5]="devices/e1000e"
DEST_MODULE_LOCATION[5]="/extra"

BUILT_MODULE_NAME[6]="ec_r8169"
BUILT_MODULE_LOCATION[6]="devices/r8169"
DEST_MODULE_LOCATION[6]="/extra"

BUILT_MODULE_NAME[7]="ec_igb"
BUILT_MODULE_LOCATION[7]="devices/igb"
DEST_MODULE_LOCATION[7]="/extra"

BUILT_MODULE_NAME[8]="ec_igc"
BUILT_MODULE_LOCATION[8]="devices/igc"
DEST_MODULE_LOCATION[8]="/extra"

BUILT_MODULE_NAME[9]="ec_genet"
BUILT_MODULE_LOCATION[9]="devices/genet"
DEST_MODULE_LOCATION[9]="/extra"

AUTOINSTALL="yes"
