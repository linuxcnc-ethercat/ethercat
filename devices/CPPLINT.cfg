# Device drivers under this directory are largely verbatim copies of
# in-kernel drivers (see the various update.sh scripts), which are
# formatted with tabs as required by the Linux kernel coding style.
# Reformatting them to spaces would make future updates against the
# upstream sources needlessly hard to diff/merge, so the tab check is
# disabled here. This filter is added on top of (not instead of) the
# top-level CPPLINT.cfg, so it only relaxes tab checking for the
# driver tree -- master code elsewhere continues to be checked.
filter=-whitespace/tab

# A few older native drivers (8139too, e100, and the pre-devices/r8169/
# legacy r8169 versions) still live directly in this directory instead
# of their own subdirectory, side by side with hand-written EtherCAT
# glue code (ecdev.h, generic.c). Per-driver style exceptions (see e.g.
# devices/igb/CPPLINT.cfg) can only be scoped per-directory, so they
# can't be given to just these files here without also loosening the
# checks for the hand-written code. Exempt them by name instead; the
# hand-written files keep full linting.
exclude_files=^(8139too|e100|r8169)-.*\.[ch]$
