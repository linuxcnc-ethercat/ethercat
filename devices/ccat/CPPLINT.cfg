# The CCAT driver is largely a verbatim copy of Beckhoff's own driver
# (https://github.com/Beckhoff/CCAT), kept in sync by hand rather than via
# an update.sh script. Beckhoff's own coding style differs from this
# project's cpplint rules in several ways that have nothing to do with the
# EtherCAT integration bits; reformatting the copied parts would make
# future diffs against upstream needlessly hard to read. This filter is
# added on top of (not instead of) devices/CPPLINT.cfg and the top-level
# CPPLINT.cfg, so it only relaxes these checks for the CCAT driver -- the
# rest of the tree, including the tab check, is unaffected.
filter=-build/include
filter=-build/include_order
filter=-readability/todo
filter=-whitespace/comma
filter=-whitespace/line_length
filter=-whitespace/operators
filter=-whitespace/parens
